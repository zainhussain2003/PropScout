name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  typecheck-frontend:
    name: Type check — web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspace=apps/web

  typecheck-api:
    name: Type check — api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspace=apps/api

  test-frontend:
    name: Tests — web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/web

  test-api:
    name: Tests — api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=apps/api

  test-python:
    name: Tests — calc engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd services/calc-engine
          pip install -r requirements.txt
      - name: Unit tests
        run: |
          cd services/calc-engine
          pytest . -v --ignore=tests/
      - name: Calculation regression (100% gate)
        run: |
          cd services/calc-engine
          pytest tests/test_regression.py -v

  lint:
    name: Lint — web + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Both workspaces run eslint with --max-warnings 0. This was never wired into
      # CI, so `npm run lint --workspace=apps/api` had been failing on master
      # (5 dead eslint-disable directives) without anything catching it.
      - run: npm run lint --workspace=apps/web
      - run: npm run lint --workspace=apps/api

  test-scrapers:
    name: Tests — scrapers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd services/scrapers
          pip install -r requirements.txt
      # Playwright browsers are NOT installed: every scraper test mocks the
      # network and the browser. Installing chromium here would add ~2 min for
      # nothing. Add `playwright install --with-deps chromium` if a test ever
      # needs a real browser.
      - name: Unit tests
        run: |
          cd services/scrapers
          pytest . -v

  golden-dataset:
    name: Golden dataset regression (95%+ gate)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd services/calc-engine
          pip install -r requirements.txt
      - name: Golden dataset extraction accuracy
        run: |
          cd services/calc-engine
          pytest tests/golden_dataset/test_extraction.py -v
